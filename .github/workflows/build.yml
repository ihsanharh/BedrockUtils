name: Build BedrockUtils

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build Windows x64 DLL
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        # Use clang-cl + lld-link to match the local Linux cross-compile toolchain.
        # ilammy/msvc-dev-cmd provides the Windows SDK and CRT headers/libs that
        # clang-cl needs. LLVM is pre-installed on windows-latest.
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link

      - name: Build
        run: cmake --build build --parallel

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedrockUtils-x64
          path: build/BedrockUtils.dll
          if-no-files-found: error
